# hypridle — idle blanking and lock.
#
# The wake path deliberately does NOT stop at a bare dpms on. An output can
# come back with its CRTC released (DRM: status=connected, enabled=disabled),
# and no amount of dpms revives that — on minerva the two DisplayPort monitors
# sat dark through repeated dpms calls until a real modeset ran, and before
# that the only cure was a KVM switch away and back. hypr-dpms-wake escalates
# to that modeset. Per-output dpms is not an option: Hyprland 0.56's Lua
# dispatcher ignores the monitor argument.
# Commands run through /bin/sh, so $HOME expands.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $HOME/code/tomfordweb/dotfiles/bin/hypr-dpms-wake
}

listener {
    timeout = 3600 # 1 hour — blank the displays (DPMS off)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = $HOME/code/tomfordweb/dotfiles/bin/hypr-dpms-wake
}

listener {
    timeout = 3600 # 1 hour — lock the session (kept in step with the blank above)
    on-timeout = loginctl lock-session
}
