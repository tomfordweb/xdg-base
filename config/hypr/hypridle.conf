# hypridle — idle blanking and lock.
#
# The wake path deliberately does NOT use `hyprctl dispatch dpms on`. That is a
# single request across all outputs and can leave one behind: on minerva the
# HDMI ultrawide sat at dpmsStatus:false while both DisplayPort monitors read
# true, connector still `connected`, and only a KVM switch away and back
# revived it. hypr-dpms-wake asks each output individually and retries.
# Commands run through /bin/sh, so $HOME expands.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $HOME/code/tomfordweb/dotfiles/bin/hypr-dpms-wake
}

listener {
    timeout = 3600 # 1 hour — blank the displays (DPMS off)
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = $HOME/code/tomfordweb/dotfiles/bin/hypr-dpms-wake
}

listener {
    timeout = 3600 # 1 hour — lock the session (kept in step with the blank above)
    on-timeout = loginctl lock-session
}
